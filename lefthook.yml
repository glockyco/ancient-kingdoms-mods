# Git hooks managed by lefthook (replaces husky + lint-staged).
# Refreshed automatically by `pnpm install` (root `prepare` script) or manually
# via `pnpm exec lefthook install`.
#
# Everything runs on pre-commit, scoped per package by glob: a website-only
# commit runs the website jobs and skips the Python ones, and vice versa. Within
# a package, jobs run top-to-bottom: format -> lint -> type-check -> test. Unlike
# lint-staged, lefthook runs against the real working tree, so SvelteKit's
# generated `.svelte-kit/types` are present and `svelte-check` reports accurately.

assert_lefthook_installed: true

pre-commit:
  skip:
    - merge
    - rebase
  jobs:
    - name: website-prettier
      root: website/
      glob: "**/*.{js,mjs,cjs,ts,svelte,css,json,md,html}"
      run: nix develop --command pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: website-eslint
      root: website/
      glob: "**/*.{js,mjs,cjs,ts,svelte}"
      run: nix develop --command pnpm exec eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true
    - name: website-check
      glob: "website/**/*.{ts,svelte}"
      run: nix develop --command pnpm --filter website check
    - name: website-test
      glob: "website/**/*.{ts,svelte}"
      run: nix develop --command pnpm --filter website test
    # Knip resolves imports, so it needs the generated src/lib/generated/home-counts.ts
    # that a clean CI checkout lacks. It runs here instead, where that file exists.
    - name: knip
      glob: "{website/**/*.{ts,svelte,mjs,css},scripts/**,knip.config.ts,package.json,website/package.json}"
      run: nix develop --command pnpm check:knip
    # These two artifacts are generated from website/data/compendium.db and then
    # committed, because a clean checkout has no database to derive them from. The
    # database is untracked, so a game update changes their content while staging
    # no file that names them. Both globs therefore include version.ts: a data
    # update ends by publishing that version, so the check runs exactly once per
    # update. Without it a stale artifact commits silently.
    - name: website-skill-effect-parity-drift
      glob: "{website/src/lib/utils/formatSkillEffect.ts,website/src/lib/utils/format.ts,website/src/lib/skills/*.ts,website/scripts/gen-skill-effect-parity.ts,website/src/lib/constants/version.ts,tests/BetterBestiary.Tests/Fixtures/skill-effect-parity.json}"
      run: nix develop --command pnpm --filter website gen:skill-effect-parity && git diff --exit-code -- tests/BetterBestiary.Tests/Fixtures/skill-effect-parity.json
    - name: website-home-counts-drift
      glob: "{website/scripts/generate-home-counts.mjs,website/src/lib/constants/version.ts,website/src/lib/generated/home-counts.ts}"
      run: nix develop --command pnpm --filter website gen:home-counts && git diff --exit-code -- website/src/lib/generated/home-counts.ts
    - name: build-pipeline-ruff-format
      root: build-pipeline/
      glob: "**/*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    - name: build-pipeline-ruff-lint
      root: build-pipeline/
      glob: "**/*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    - name: build-pipeline-mypy
      root: build-pipeline/
      glob: "**/*.py"
      run: uv run mypy .
    - name: build-pipeline-test
      root: build-pipeline/
      glob: "**/*.py"
      run: uv run pytest
    - name: mods-build
      glob: "{mods/*/*.cs,mods/**/*.cs,mods/*/*.csproj,build-tool/*.cs,build-tool/**/*.cs,build-tool/*.csproj,Directory.Build.props}"
      run: dotnet run --project build-tool build
    # The test projects compile mod and build-tool sources directly, so a change to
    # either side can break them. The skill-effect parity corpus is generated by the
    # website job above and consumed here, so this is the only job that compares the
    # two formatters. Without it the corpus is written and never checked.
    - name: dotnet-tests
      glob: "{mods/**/*.cs,mods/*/*.csproj,build-tool/**/*.cs,build-tool/*.csproj,tests/**,Directory.Build.props}"
      run: dotnet test tests/BetterBestiary.Tests && dotnet test tests/BossSkillTracker.Tests && dotnet test tests/BuildTool.Tests && dotnet test tests/DataExporter.Tests && dotnet test tests/HotReplCommands.Tests
    - name: citations-check
      glob: "{website/src/**/*.{ts,js,svelte},build-pipeline/src/**/*.py,build-pipeline/schema.sql,mods/**/*.cs,citations.lock.json}"
      run: cd build-pipeline && uv run compendium citations check
      skip:
        - run: "! test -d server-scripts"
    - name: redactions-check
      glob: "{redactions.toml,redactions.lock.json,build-pipeline/src/compendium/redactions/**/*.py,build-pipeline/src/compendium/redaction.py}"
      run: cd build-pipeline && uv run compendium redactions check
    - name: plans docs
      glob:
        - "docs/plans/*.md"
        - "docs/plans/**/*.md"
      run: omp-plans index && omp-plans check
      stage_fixed: true
      skip:
        - run: "! command -v omp-plans"
    - name: agent-docs
      glob: "{AGENTS.md,**/AGENTS.md,.agent/skills/**,.agent/rules/**,.omp/agents/**,scripts/check-agent-docs.sh}"
      run: ./scripts/check-agent-docs.sh

commit-msg:
  jobs:
    - name: commitlint
      run: nix develop --command pnpm exec commitlint --edit {1}
