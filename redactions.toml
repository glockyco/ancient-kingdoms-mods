# Items carrying ignore_journal=true are always excluded, together with every
# entity left with no other source, because the developer asked for every item
# with this flag to stay out of the compendium. In the game the flag keeps a
# recipe's result out of the crafting journal (UIJournal.cs). There is no
# configuration to switch this off. A published entry that still needs one of
# these items, such as a quest objective or a drop, shows a redacted placeholder
# instead of the item.

# Items whose recipes are left out. The item stays published and every recipe
# that makes it is removed. The item's page and the pages of the recipe's
# materials say that a redacted recipe makes or uses them, without naming the
# recipe's other items or amounts.
[items.hide_crafting]
ids = []

# Zones whose positions the compendium leaves out at the developers' request.
# Every entity of the zone stays published. Map geometry and position fields in
# tables/data, including embedded JSON, are removed. By owner choice, rounded
# positions may remain in published placement IDs and URLs.
# In-game screenshots are allowed: they show only what a player inside sees.
# Screenshot focal points and manifests use landmark anchors with relative
# offsets, never absolute coordinates.
#
# Temple of Valaark: the game also keeps its layout from players. The client
# closes the live map and substitutes a static illustration, disables the
# player marker, refuses teleport items, and returns a player who enters to
# their bind point. The rest of the temple's content is published.
[zones.suppress_positions]
zone_ids = ["temple_of_valaark"]

# Zones that have not shipped. Everything related to the zone is removed: its
# rows, every row referencing it, and every entity left with no other source.
[zones.exclude_unreleased]
zone_ids = []

# Entities named for removal. Each one is removed together with everything left
# with no other source, and each removal is recorded in redactions.lock.json.
#
# Name an entity here when nothing in the data distinguishes it from content
# that is deliberately published, so no rule over the references can select it.
#
# valaarks_corrupted_seal: the Corrupted Valaark used to drop it, and its drop
# table no longer names it. Nothing else gives or uses it, so no player can
# obtain it, and the closure would publish an item no zone reaches.
#
# new_skill_placeholder: a passive every class learns by default into skill
# slot 18, with no effect and an empty tooltip. The skill window shows slots 0
# to 17 (UISkills.cs), professions start at slot 19, and veteran skills at slot
# 30, so no player ever sees it. Its rows look like any other default passive.
#
# compassion_escort: the prefab the game copies for every stranded adventurer.
# Each copy gets a generated name, the look of one of several NPCs, and its
# level and Health from the dungeon it waits in (VirtueEscort.cs Initialize,
# VirtueEscortStats.cs), so the prefab's own name, level and Health are values
# no player meets. Its row looks like any other NPC published without a
# placement.
#
# ambient_adventurer: the prefab the game copies for every NPC adventurer that
# roams the open world. Each copy gets a generated name, a random look, and a
# random level from 1 to 50 that sets its Health (AmbientAdventurer.cs
# Initialize and ApplyStats, AmbientWorldPopulation.cs Spawn), so the prefab's
# own name, level 1 and stats are values no player meets. Its row looks like
# any other NPC published without a placement.
[entities.exclude]
ids = [
    "new_skill_placeholder",
    "compassion_escort",
    "valaarks_corrupted_seal",
    "ambient_adventurer",
]

# Chambers of Chaos riddle and rune-puzzle content. Each family lists the fields
# that may be published. The riddle fields are question, choices and
# correct_answer_index. The rune-puzzle fields are title, clue, rune_words and
# solution_order. A rune puzzle's canonical word order is its solution, so
# rune_words is as revealing as solution_order. An empty list publishes no row of
# the family. A family without an entry, or a field the compendium does not know,
# fails the build, and no key grants permission by default. Both families stay
# closed until the developer's answer on which fields may be published is
# recorded in the OpenSpec change. A spoiler control does not change what is
# permitted, because it hides nothing in the page data. Change a list only with
# that recorded answer, then sync the ledger.
[challenges.riddles]
permitted_fields = []

[challenges.rune_puzzles]
permitted_fields = []
