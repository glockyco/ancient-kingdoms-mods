[project]
name = "ancient-kingdoms-compendium"
version = "0.1.0"
description = "Build pipeline for Ancient Kingdoms Compendium"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.1",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pillow>=12.3.0",
]

[project.scripts]
compendium = "compendium.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
    "vulture>=2.16",
]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"

# Typer's whole API is `param: T = typer.Option(...)`, which B008 flags as a
# function call in a default argument. Treating those constructors as immutable
# is the documented escape hatch; rewriting them would break the CLI.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.vulture]
min_confidence = 80
paths = ["src/"]
# Pydantic model field annotations are accessed dynamically; exclude them.
ignore_decorators = ["validator", "field_validator", "model_validator"]
