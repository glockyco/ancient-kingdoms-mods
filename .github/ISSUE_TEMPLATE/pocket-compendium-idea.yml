name: Pocket Compendium idea
description: Suggest something the Pocket Compendium mod could do for you.
title: "Pocket Compendium idea: "
labels: ["enhancement", "mods"]
body:
  - type: markdown
    attributes:
      value: No GitHub account? Post in the #📖-compendium channel on the [game's Discord](https://discord.gg/8MkSWjXwab) instead.
  - type: textarea
    id: goal
    attributes:
      label: What would you like to do in the game, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How Pocket Compendium could help, if you have something in mind.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag them here.
