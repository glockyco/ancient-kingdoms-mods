name: Pocket Compendium problem
description: Something in the Pocket Compendium mod does not work as it should.
title: "Pocket Compendium: "
labels: ["bug", "mods"]
body:
  - type: markdown
    attributes:
      value: No GitHub account? Post in the #📖-compendium channel on the [game's Discord](https://discord.gg/8MkSWjXwab) instead.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: What you saw and what you were doing. A sentence is enough.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Your setup
      description: The game fills this in when you report from the About page in Pocket Compendium's settings. Otherwise leave it empty.
      render: text
  - type: textarea
    id: files
    attributes:
      label: Screenshots or log file
      description: Drag them here. The log file is MelonLoader/Latest.log, which Open the log folder on the About page shows. It can contain your Windows user name.
