name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege: jobs only read the checkout.
permissions:
  contents: read

# Supersede in-flight runs for the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The repo uses a single root pnpm-lock.yaml for the whole workspace. A nested
  # lockfile (e.g. website/pnpm-lock.yaml) silently shadows it and drifts, so
  # fail fast if one reappears.
  lockfile-guard:
    name: Lockfile guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure only the root pnpm-lock.yaml exists
        run: |
          nested=$(find . -name pnpm-lock.yaml -not -path './pnpm-lock.yaml' -not -path '*/node_modules/*')
          if [ -n "$nested" ]; then
            echo "::error::Nested pnpm-lock.yaml found; only the root lockfile is allowed:"
            echo "$nested"
            exit 1
          fi
          echo "OK: root pnpm-lock.yaml is the only lockfile."

  # `pnpm install --frozen-lockfile` doubles as the drift gate: it fails if the
  # lockfile is out of sync with any package.json.
  #
  # Two things stay local, both because they need website/data/compendium.db,
  # which is generated from 128 MB of untracked exported-data:
  #   - `build`, which prerenders every detail page from it;
  #   - the `*.db.test.ts` suites, which assert against real game data.
  # Both remain enforced by the lefthook pre-commit hook. Everything else runs
  # here: src/lib/generated/home-counts.ts is committed, so svelte-check, knip
  # and the remaining suites need nothing generated.
  website:
    name: Website (prettier + lint + check + test + knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The pre-commit hook only formats staged files, so a Prettier upgrade silently
      # leaves every untouched file mis-formatted (3.9.0 reflowed short unions and
      # drifted 12 files this way). This catches that on the bump's own PR.
      - name: Format check
        run: pnpm --filter website format:check
      - name: Lint
        run: pnpm --filter website lint
      - name: Type-check
        run: pnpm --filter website check
      - name: Tests
        run: pnpm --filter website test:nodb
      - name: Unused exports and dependencies
        run: pnpm exec knip

  # The mod and build-tool test projects compile repository sources directly and
  # reference no game assembly, so they need neither the game nor Local.props.
  # HotRepl.Core is packable but is not published to NuGet. Pin and build the
  # matching source revision so HotReplCommands.Tests uses the real command API.
  # Building a mod still requires the game install, so mods stay out of CI.
  dotnet:
    name: Mods and build tool (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out HotRepl dependency
        uses: actions/checkout@v7
        with:
          repository: glockyco/HotRepl
          ref: 7d9c49ed57f5436bf7b258207ea14236333b4ac6
          path: HotRepl
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - name: Build HotRepl Core
        run: dotnet build HotRepl/src/HotRepl.Core/HotRepl.Core.csproj --framework netstandard2.1
      - name: Tests
        env:
          HOTREPL_REPO_PATH: ${{ github.workspace }}/HotRepl
        run: |
          for project in tests/*/; do
            dotnet test "$project"
          done

  # The OpenSpec artifacts are repository content, and nothing verified them
  # until now. The check itself is defined once for the whole workstation in the
  # fleet input: it fails on an invalid artifact and on a change archived with
  # unfinished tasks.
  openspec:
    name: OpenSpec artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Validate OpenSpec artifacts
        run: nix build --no-link ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).openspec"

  build-pipeline:
    name: Build pipeline (ruff + mypy + vulture + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: build-pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: build-pipeline/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy .
      - name: Dead-code scan
        run: uv run vulture src/ --min-confidence 80
      - name: Tests
        run: uv run pytest
