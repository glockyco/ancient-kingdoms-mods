name = "ancient-kingdoms-compendium-site"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2025-11-27"
compatibility_flags = ["nodejs_compat"]

# Production lives on the custom domain. workers.dev preview is disabled so the
# old `ancient-kingdoms-compendium.wowmuch1.workers.dev` hostname continues to
# belong to the redirect-only Worker (see wrangler.redirect.toml), not this one.
workers_dev = false

[[routes]]
pattern = "ancient-kingdoms.compendiums.org"
custom_domain = true

# adapter-cloudflare emits the Worker and static assets into the same directory.
# Its generated .assetsignore excludes Worker and routing control files.
# Other files, including _app, remain static assets.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# A separate demo Worker for showing unreleased work, at
# `ancient-kingdoms-compendium-demo.<account>.workers.dev`. It has no custom
# domain (routes do not inherit into environments) and its pages keep their
# canonical links to the production domain. Deploy with:
# pnpm -C website cf-deploy:demo
[env.demo]
name = "ancient-kingdoms-compendium-demo"
workers_dev = true
routes = []

[env.demo.assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
