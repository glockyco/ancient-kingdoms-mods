<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <style>
      /* Instant theme based on system preference - no JS delay */
      /* Match Tailwind's actual background colors */
      html {
        background-color: oklch(1 0 0);
        color: oklch(0.129 0.042 264.695);
      }
      @media (prefers-color-scheme: dark) {
        html:not(.light) {
          background-color: oklch(0.129 0.042 264.695);
          color: oklch(0.984 0.003 247.858);
        }
      }
      /* Explicit dark mode */
      html.dark {
        background-color: oklch(0.129 0.042 264.695);
        color: oklch(0.984 0.003 247.858);
      }
    </style>
    <script>
      // A deploy deletes the previous build's scripts while the edge may
      // still serve its pages for up to a minute (see _headers). When the
      // scripts fail to start, load the page once more past the edge cache.
      // The layout sets __sitebooted once the app has started.
      (function () {
        const url = new URL(location.href);
        if (url.searchParams.has("fresh")) {
          url.searchParams.delete("fresh");
          history.replaceState(history.state, "", url);
          return;
        }
        addEventListener("unhandledrejection", function () {
          if (window.__sitebooted) return;
          url.searchParams.set("fresh", String(Date.now()));
          location.replace(url);
        });
      })();
    </script>
    <script>
      // Handle explicit user preference (overrides system preference)
      (function () {
        const theme = localStorage.getItem("mode-watcher-mode");
        if (theme === "dark") {
          document.documentElement.classList.add("dark");
        } else if (theme === "light") {
          document.documentElement.classList.add("light");
        }
        // If no explicit preference, CSS media query handles it

        // The home page's layout choice (HomeLayoutToggle), applied before
        // the first paint so the other layout never flashes.
        if (localStorage.getItem("home-layout") === "classic") {
          document.documentElement.classList.add("home-classic");
        }
      })();
    </script>
    %sveltekit.head%
    <script>
      // A table replaces its prerendered rows when the page starts only if
      // the URL carries its state or it restores saved choices. Only then is
      // its loading cover shown before the scripts run (DataTable).
      (function () {
        const names = [...new URLSearchParams(location.search).keys()];
        for (const meta of document.querySelectorAll(
          'meta[name="table-state"]',
        )) {
          const key = meta.content;
          let pending = names.some((name) => name.startsWith(key + "."));
          if (!pending && meta.hasAttribute("data-restores-saved")) {
            try {
              pending = localStorage.getItem("table-state-" + key) !== null;
            } catch {
              // Storage may be unavailable.
            }
          }
          if (pending) {
            document.documentElement.classList.add("table-state-pending");
            return;
          }
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <script
      defer
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "c0612d54010c4dfaaf617f8d90dbae28"}'
    ></script>
  </body>
</html>
